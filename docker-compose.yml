# ═══════════════════════════════════════════════════════════════════
#  صِمَام — تشغيل بأمر واحد
#
#      docker compose up -d --build
#
#  الصورة نفسها الموصوفة في Dockerfile: الواجهة والـ API وقاعدة المعرفة
#  المفهرسة في حاوية واحدة، على منفذ واحد.
# ═══════════════════════════════════════════════════════════════════

services:
  samaam:
    build: .
    image: samaam:latest
    container_name: samaam
    restart: unless-stopped

    # المنفذ الداخلي 8000 ثابت داخل الحاوية ولا يزاحم أحداً. أما منفذ
    # المضيف فـ 3172 — رقم المعيار الذي تنفّذه هذه البوابة، ITU-T Y.3172.
    # اختير لأنه يكاد لا يُستخدم: المنافذ المعتادة (80 · 3000 · 8000 · 8080)
    # مأخوذة على أي سيرفر يحمل تطبيقات أخرى، والاصطدام بها يُفشل الإقلاع
    # عند التشغيل لا عند القراءة، فيبدو الملف سليماً ولا شيء يعمل.
    #
    #   http://<IP>:3172        ← الافتراضي
    #   SAMAAM_PORT=80          ← إن كان 80 فارغاً حقاً، فيصير http://<IP>
    ports:
      - "${SAMAAM_PORT:-3172}:8000"

    environment:
      # اختياري بالكامل. بدونه يعمل كل شيء — الاسترجاع والحجب والـ 403 —
      # ويغيب الشرح النصّي وحده، وهو الجزء الوحيد الذي يمرّ على النموذج.
      SAMAAM_LLM_API_KEY: "${SAMAAM_LLM_API_KEY:-}"

    # لا مجلدات مشتركة عمداً: فهرس ChromaDB محزوم داخل الصورة وقت البناء،
    # وأي volume على kb/chroma سيحجبه ويقلع النظام بقاعدة معرفة فارغة.

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
