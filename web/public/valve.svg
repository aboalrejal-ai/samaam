<!-- The valve mark. A static asset cannot read CSS variables, so the two
     literals here are transcribed from design/dashboard/tokens.css:
     fill = --accent (#0ea5e9), stroke = --accent-on (#04131d).
     This file is the only place in web/ that writes a colour literal. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <rect width="24" height="24" rx="5" fill="#0ea5e9" />
  <g stroke="#04131d" stroke-width="2" stroke-linecap="round">
    <path d="M12 4v5.2M12 14.8V20" />
    <circle cx="12" cy="12" r="3.2" />
    <path d="M4.6 12h3.4M16 12h3.4" />
  </g>
</svg>
